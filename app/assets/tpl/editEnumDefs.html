<h2>
	<div class="icon enum"></div>
	::projectEnumsTitle::
</h2>

<div class="enumList">
	<div class="buttons">
		<button class="createEnum"> <span class="icon add"></span> </button>
		<button class="import small">::importBtn::</button>
	</div>
	<div class="search"></div>
	<ul class="niceList"></ul>
</div>

<div class="help none">
	::enumsHelpText::
</div>

<div class="enumFormWrapper">
	<dl class="form enumForm">
		<dt class="onlyExternal">
			<label>::sourceFileLabel::</label>
			<info>::sourceFileInfo::</info>
		</dt>

		<dd class="source">
		</dd>


		<dt>
			<label for="id">::enumIdentifierLabel::</label>
			<div class="info identifier"></div>
		</dt>
		<dd>
			<input type="text" name="id" id="id"/>
		</dd>


		<dt>
			<label for="icons">::iconTilesetLabel::</label>
			<div class="info">::iconTilesetInfo::</div>
		</dt>
		<dd>
			<select id="icons"></select>
		</dd>

		<dt class="noExternal">
			<label for="tags">::tagsLabel::</label>
			<div class="info">::tagsInfo::</div>
		</dt>
		<dd class="noExternal">
			<div id="tags"></div>
		</dd>
	</dl>


	<div class="valuesWrapper">
		<h2>::allValuesTitle::</h2>
		<button class="createEnumValue noExternal gray">::addValueBtn::</button>
		<ul class="enumValues"></ul>
	</div>

</div>


<!-- Template -->
<xml class="enum">
	<div class="sortHandle"></div>
	<div class="pickerWrapper"></div>
	<input type="color" name="color"/>
	<input type="text" class="name" placeholder="REQUIRED - Unique identifier"/>
	<button class="delete gray noExternal"> <span class="icon delete"></span> </button>
</xml>
